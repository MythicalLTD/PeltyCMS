# Draft release notes for the next stable cut. Tags are always v-prefixed
# SemVer (v1.0.0). Next public line is v1.x — do not continue MythicalDash 3.x.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
prerelease-identifier: rc
# Only PeltyCMS releases count as "previous release": MythicalDash left 3.x
# releases (e.g. 3.5.4-aurora) from an unrelated history, which made the
# compare step fail with "No common ancestor". PeltyCMS tags are v-prefixed
# and target develop.
tag-prefix: "v"
filter-by-commitish: true
commitish: develop
categories:
  - title: Features
    labels: [feature, enhancement]
  - title: Fixes
    labels: [fix, bug]
  - title: Docs
    labels: [docs, documentation]
  - title: Maintenance
    labels: [chore, dependencies, ci]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels: [major]
  minor:
    labels: [minor, feature, enhancement]
  patch:
    labels: [patch, fix, bug, chore, dependencies, ci, docs, documentation]
  default: patch
template: |
  ## Changes

  $CHANGES
