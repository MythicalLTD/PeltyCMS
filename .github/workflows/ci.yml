name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Shared Postgres for Rust integration tests (see crates/pelty-api/tests).
  TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/peltycms_test
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/peltycms_test
  # Persist wasmtime compiled modules across steps/runs (see pelty-wasm).
  PELTY_WASM_CACHE_DIR: ${{ github.workspace }}/.cache/pelty-wasm

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
      workflow_scripts: ${{ steps.filter.outputs.workflow_scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'locales/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'xtask/**'
              - 'migrations/**'
              - 'extensions/**'
              - 'locales/**'
              - '.cargo/**'
              - 'Makefile'
              - 'scripts/test-ci-linker.sh'
              - '.github/workflows/ci.yml'
            workflow_scripts:
              - '.github/workflows/**'
              - 'scripts/release-archives.sh'
              - 'scripts/test-release-archives.sh'
            # Full image is already built on nightly/release. CI only rechecks
            # when packaging inputs change (or the PR has the `docker` label).
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  workflow-scripts:
    name: Workflow shell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.workflow_scripts == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Test portable release archive discovery (no publishing)
        run: /bin/bash scripts/test-release-archives.sh

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build

  rust-lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Target-scoped flags also cover native cargo/xtask builds, but must not
      # leak into the child wasm32-wasip2 builds run by xtask or test fixtures.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Faster linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        # Same surface as `cargo xtask lint` / Makefile (no -D warnings yet).
        run: cargo clippy --workspace --all-targets --locked

  rust-test:
    name: Rust test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Target-scoped flags also cover native cargo/xtask builds, but must not
      # leak into the child wasm32-wasip2 builds run by xtask or test fixtures.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    # Integration suite links one large binary (wasmtime + sqlx + addons).
    # Keep disk free and cache the registry/target aggressively.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peltycms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d peltycms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-targets: true
          # Also keep the separate addons WASM target dir warm.
          cache-directories: target/addons

      - name: Cache addon zips + wasmtime modules
        uses: actions/cache@v4
        with:
          path: |
            extensions/addons/dist
            .cache/pelty-wasm
          key: addons-wasm-${{ hashFiles('extensions/addons/**/Cargo.toml', 'extensions/addons/**/Cargo.lock', 'extensions/addons/**/addon.json', 'extensions/addons/**/src/**', 'Cargo.lock') }}
          restore-keys: |
            addons-wasm-

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      # Service healthcheck covers Postgres. poppler is for PDF assertions;
      # clang/lld cuts link time on the fat pelty-api test binary.
      - name: Install CI deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils clang lld

      - name: Check native/WASM linker isolation
        run: bash scripts/test-ci-linker.sh

      - name: Build WASM addons
        run: |
          mkdir -p "$PELTY_WASM_CACHE_DIR" extensions/addons/dist
          # Hit path: dist already populated from cache and sources unchanged.
          if compgen -G "extensions/addons/dist/*.zip" > /dev/null; then
            echo "Reusing cached addon zips ($(ls extensions/addons/dist/*.zip | wc -l) files)"
          fi
          cargo xtask addons

      - name: Test workspace
        # Skip doctests: they re-compile crates and add little signal in CI.
        run: cargo test --workspace --locked --lib --bins --tests
        env:
          # Quiet sqlx noise in CI logs.
          RUST_LOG: error,sqlx=off

  docker:
    name: Docker
    needs: changes
    # Build only when packaging inputs change (or a PR is labeled `docker`).
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.docker == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'docker'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Addon crates live as PeltyCMS/addon-* submodules under extensions/addons.
          submodules: recursive

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: peltycms:ci
          cache-from: type=gha,scope=peltycms-ci-docker
          cache-to: type=gha,mode=max,scope=peltycms-ci-docker
