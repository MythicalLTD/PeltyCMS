# Multi-platform release: Linux (x64/ARM gnu+musl), Windows (x64/ARM), macOS
# (Intel + Apple Silicon). Packages via `cargo xtask release`, publishes a
# GitHub Release, and pushes the Docker image to GHCR.
#
# Progressive publish: open a (pre)release as soon as packaging starts, then each
# matrix job uploads its archive the moment it finishes — so downloads are
# available without waiting for the full ~1–3h matrix. Checksums, floating
# `nightly`, and Docker land in the final Publish job. Prereleases never become
# GitHub "latest"; stable stays draft until Publish undrafts it.
#
# Tags are always v-prefixed SemVer (v1.0.0, v1.0.0-rc.1, v0.1.0-nightly.DATE).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without leading v (e.g. 1.0.0 or 1.0.0-rc.1)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "SemVer without leading v"
        required: true
        type: string
      floating_tag:
        description: "Also retarget this release/Docker tag (e.g. nightly)"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to build (e.g. develop for nightlies). Empty = event SHA."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/mythicalltd/peltycms

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      floating: ${{ steps.meta.outputs.floating }}
      # Pin once so a 3h matrix does not drift to a newer develop tip mid-run.
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 1

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [ -z "$raw" ]; then
            raw="${{ github.ref_name }}"
          fi
          raw="${raw#v}"
          if ! [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing version '$raw' (need MAJOR.MINOR.PATCH or pre like 1.0.0-rc.1)" >&2
            exit 1
          fi
          floating="${{ inputs.floating_tag }}"
          sha="$(git rev-parse HEAD)"
          {
            echo "version=$raw"
            echo "tag=v$raw"
            if [[ "$raw" == *-* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
            echo "floating=${floating}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing PeltyCMS v$raw @ ${sha}"

  # Open the GitHub Release early (prerelease, or draft for stable) so matrix
  # jobs can upload archives as they finish. Do NOT pass --target (see Publish).
  open-release:
    name: Open release
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create progressive release shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          sha="${{ needs.meta.outputs.sha }}"
          pre="${{ needs.meta.outputs.prerelease }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; matrix will upload into it"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git tag "$tag" "$sha"
            git push origin "refs/tags/${tag}"
          fi
          {
            echo "# PeltyCMS ${tag}"
            echo
            echo "🚧 **Building** — platform archives appear below as each CI job finishes."
            echo "SHA256SUMS / manifest.json / Docker land when Publish completes."
            echo
            echo "This is a **prerelease** (or draft) and is never GitHub Latest until Publish undrafts a stable tag."
          } > "$RUNNER_TEMP/building-notes.md"
          args=(--title "PeltyCMS ${tag} (building…)" --notes-file "$RUNNER_TEMP/building-notes.md")
          if [ "$pre" = "true" ]; then
            args+=(--prerelease)
          else
            # Stable: stay draft so we never briefly own "Latest" with a partial set.
            args+=(--draft)
          fi
          gh release create "$tag" "${args[@]}"
          echo "Opened ${tag} for progressive uploads"

  frontend:
    name: Frontend assets
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build web UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 2

  # One job per target so Linux (and macOS) targets build in parallel instead of
  # serializing four zig builds on a single runner.
  package:
    name: Package (${{ matrix.name }})
    needs: [meta, frontend, open-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: false
          - name: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - name: linux-arm64-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
          - name: linux-arm64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
          # Native ARM64 Windows (cargo-xwin from Linux breaks ring/aws-lc on /imsvc).
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            zig: false
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            zig: false
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            zig: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
          # Addon crates live as PeltyCMS/addon-* submodules under extensions/addons.
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Registry/git only. Target dirs are multi-GB per matrix cell and were
      # blowing the free 10 GiB Actions cache quota (evicting CI lint/test caches).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-targets: false

      - name: Free disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      # pip ziglang 0.17+ only ships `python-zig` (not `zig`); cargo-zigbuild needs `zig` on PATH.
      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          if [ "${{ matrix.zig }}" = "true" ]; then
            command -v zig
            command -v cargo-zigbuild
            zig version
          fi
          cargo xtask release "${{ needs.meta.outputs.version }}" \
            --skip-assets \
            --targets "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/${{ needs.meta.outputs.version }}/pelty-server-*
          if-no-files-found: error
          retention-days: 2

      # Progressive: archive is downloadable as soon as this target finishes.
      - name: Upload archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          ver="${{ needs.meta.outputs.version }}"
          # macOS ships Bash 3.2, which has no mapfile builtin.
          source scripts/release-archives.sh
          collect_release_archives "dist/${ver}"
          files=("${RELEASE_ARCHIVES[@]}")
          test "${#files[@]}" -gt 0
          # Retry: Open release may still be propagating, or another upload races.
          for i in 1 2 3 4 5; do
            if gh release upload "$tag" "${files[@]}" --clobber; then
              echo "Uploaded ${files[*]##*/} → ${tag}"
              exit 0
            fi
            echo "upload attempt ${i} failed; retrying…"
            sleep $((i * 5))
          done
          echo "Failed to upload to ${tag}" >&2
          exit 1

  publish:
    name: Publish
    needs: [meta, package]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          # Addon crates live as PeltyCMS/addon-* submodules under extensions/addons.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/${{ needs.meta.outputs.version }}

      - name: Optional release signing key
        env:
          PELTY_RELEASE_KEY_SECRET: ${{ secrets.PELTY_RELEASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PELTY_RELEASE_KEY_SECRET:-}" ]; then
            if [ "${{ needs.meta.outputs.prerelease }}" = "false" ]; then
              echo "::warning::PELTY_RELEASE_KEY secret is not set; stable release will ship without SHA256SUMS.sig"
            else
              echo "No PELTY_RELEASE_KEY; prerelease will be unsigned"
            fi
            exit 0
          fi
          key="$RUNNER_TEMP/pelty-release-signing.key"
          printf '%s\n' "$PELTY_RELEASE_KEY_SECRET" > "$key"
          chmod 600 "$key"
          echo "PELTY_RELEASE_KEY=$key" >> "$GITHUB_ENV"

      - name: Assemble checksums + manifest
        run: |
          set -euo pipefail
          ls -la "dist/${{ needs.meta.outputs.version }}"
          cargo xtask release "${{ needs.meta.outputs.version }}" --assemble

      # Finalize the progressive release: checksums + real notes. Stable leaves
      # draft here. Never use --target (needs workflows:write vs main).
      - name: Finalize GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"
          dist="dist/${ver}"
          notes="${dist}/CHANGELOG.md"
          # Meta files only — archives were uploaded per-target already.
          mapfile -t meta_files < <(find "$dist" -maxdepth 1 -type f \
            \( -name 'SHA256SUMS*' -o -name 'manifest.json' \) | sort)
          test "${#meta_files[@]}" -gt 0
          gh release upload "$tag" "${meta_files[@]}" --clobber
          edit_args=(--title "PeltyCMS ${tag}" --notes-file "$notes")
          if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then
            edit_args+=(--prerelease)
          else
            # Promote draft → published Latest only when the full set is ready.
            edit_args+=(--draft=false)
          fi
          gh release edit "$tag" "${edit_args[@]}"
          echo "Finalized ${tag}"

      - name: Retarget floating prerelease tag
        if: needs.meta.outputs.floating != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          float="${{ needs.meta.outputs.floating }}"
          ver="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"
          sha="${{ needs.meta.outputs.sha }}"
          dist="dist/${ver}"
          notes="${dist}/CHANGELOG.md"
          mapfile -t files < <(find "$dist" -maxdepth 1 -type f ! -name 'CHANGELOG.md' | sort)
          if gh release view "$float" >/dev/null 2>&1; then
            gh release delete "$float" --yes --cleanup-tag || gh release delete "$float" --yes
          fi
          git tag -f "$float" "$sha"
          git push -f origin "refs/tags/${float}"
          {
            echo "## PeltyCMS Nightly"
            echo
            echo "Floating tip of \`develop\` — same bits as **${tag}**."
            echo
            echo "### Platforms"
            echo
            echo "- Linux x64 / ARM64 (\`.tar.gz\`, gnu + musl)"
            echo "- Windows x64 / ARM64 (\`.zip\`)"
            echo "- macOS Intel / Apple Silicon (\`.tar.gz\`)"
            echo "- Docker: \`docker pull ghcr.io/mythicalltd/peltycms:nightly\`"
            echo
            echo "Admin → Updates → channel **Nightly**, then check or run \`pelty-server update\`."
            echo
            echo "---"
            echo
            cat "$notes"
          } > "$RUNNER_TEMP/nightly-notes.md"
          # No --target — tag already points at sha.
          gh release create "$float" "${files[@]}" \
            --title "PeltyCMS Nightly (${tag})" \
            --notes-file "$RUNNER_TEMP/nightly-notes.md" \
            --prerelease

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          float="${{ needs.meta.outputs.floating }}"
          tags="${IMAGE}:${tag}"
          if [ "${{ needs.meta.outputs.prerelease }}" = "false" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          if [ -n "$float" ]; then
            tags="${tags}"$'\n'"${IMAGE}:${float}"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Free disk for Docker
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker.outputs.tags }}
          cache-from: type=gha,scope=peltycms-docker
          cache-to: type=gha,mode=max,scope=peltycms-docker
