# Multi-platform release: Linux (x64/ARM gnu+musl), Windows (x64/ARM), macOS
# (Intel + Apple Silicon). Packages via `cargo xtask release`, publishes a
# GitHub Release, and pushes the Docker image to GHCR.
#
# Tags are always v-prefixed SemVer (v1.0.0, v1.0.0-rc.1, v0.1.0-nightly.DATE).
# Prereleases never become GitHub "latest" and never get the :latest Docker tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without leading v (e.g. 1.0.0 or 1.0.0-rc.1)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "SemVer without leading v"
        required: true
        type: string
      floating_tag:
        description: "Also retarget this release/Docker tag (e.g. nightly)"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to build (e.g. develop for nightlies). Empty = event SHA."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/mythicalltd/peltycms

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      floating: ${{ steps.meta.outputs.floating }}
    steps:
      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [ -z "$raw" ]; then
            raw="${{ github.ref_name }}"
          fi
          raw="${raw#v}"
          if ! [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing version '$raw' (need MAJOR.MINOR.PATCH or pre like 1.0.0-rc.1)" >&2
            exit 1
          fi
          floating="${{ inputs.floating_tag }}"
          {
            echo "version=$raw"
            echo "tag=v$raw"
            if [[ "$raw" == *-* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
            echo "floating=${floating}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing PeltyCMS v$raw"

  frontend:
    name: Frontend assets
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          # Addon crates live as PeltyCMS/addon-* submodules under extensions/addons.
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build web UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 2

  package:
    name: Package (${{ matrix.name }})
    needs: [meta, frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
            zig: true
            xwin: false
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            zig: false
            xwin: false
          # ARM64 Windows is cross-built with cargo-xwin (x64 runners lack the ARM MSVC linker).
          - name: windows-arm64
            os: ubuntu-latest
            targets: aarch64-pc-windows-msvc
            zig: false
            xwin: true
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            zig: false
            xwin: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          # Addon crates live as PeltyCMS/addon-* submodules under extensions/addons.
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Free disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        run: |
          set -euo pipefail
          pip install --user ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked

      - name: Install cargo-xwin
        if: matrix.xwin
        run: cargo install cargo-xwin --locked

      - name: Package archives
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          cargo xtask release "${{ needs.meta.outputs.version }}" \
            --skip-assets \
            --targets "${{ matrix.targets }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/${{ needs.meta.outputs.version }}/pelty-server-*
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish
    needs: [meta, package]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          # Addon crates live as PeltyCMS/addon-* submodules under extensions/addons.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/${{ needs.meta.outputs.version }}

      - name: Optional release signing key
        env:
          PELTY_RELEASE_KEY_SECRET: ${{ secrets.PELTY_RELEASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PELTY_RELEASE_KEY_SECRET:-}" ]; then
            if [ "${{ needs.meta.outputs.prerelease }}" = "false" ]; then
              echo "::warning::PELTY_RELEASE_KEY secret is not set; stable release will ship without SHA256SUMS.sig"
            else
              echo "No PELTY_RELEASE_KEY; prerelease will be unsigned"
            fi
            exit 0
          fi
          key="$RUNNER_TEMP/pelty-release-signing.key"
          printf '%s\n' "$PELTY_RELEASE_KEY_SECRET" > "$key"
          chmod 600 "$key"
          echo "PELTY_RELEASE_KEY=$key" >> "$GITHUB_ENV"

      - name: Assemble checksums + manifest
        run: |
          set -euo pipefail
          ls -la "dist/${{ needs.meta.outputs.version }}"
          cargo xtask release "${{ needs.meta.outputs.version }}" --assemble

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"
          dist="dist/${ver}"
          notes="${dist}/CHANGELOG.md"
          mapfile -t files < <(find "$dist" -maxdepth 1 -type f ! -name 'CHANGELOG.md' | sort)
          pre_args=()
          if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then
            pre_args+=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "PeltyCMS ${tag}" --notes-file "$notes" "${pre_args[@]}"
          else
            gh release create "$tag" "${files[@]}" \
              --title "PeltyCMS ${tag}" \
              --notes-file "$notes" \
              --target "${{ github.sha }}" \
              "${pre_args[@]}"
          fi

      - name: Retarget floating prerelease tag
        if: needs.meta.outputs.floating != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          float="${{ needs.meta.outputs.floating }}"
          ver="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"
          dist="dist/${ver}"
          notes="${dist}/CHANGELOG.md"
          mapfile -t files < <(find "$dist" -maxdepth 1 -type f ! -name 'CHANGELOG.md' | sort)
          if gh release view "$float" >/dev/null 2>&1; then
            gh release delete "$float" --yes --cleanup-tag || gh release delete "$float" --yes
          fi
          git tag -f "$float" "${{ github.sha }}"
          git push -f origin "refs/tags/${float}"
          {
            echo "## PeltyCMS Nightly"
            echo
            echo "Floating tip of \`develop\` — same bits as **${tag}**."
            echo
            echo "### Platforms"
            echo
            echo "- Linux x64 / ARM64 (\`.tar.gz\`, gnu + musl)"
            echo "- Windows x64 / ARM64 (\`.zip\`)"
            echo "- macOS Intel / Apple Silicon (\`.tar.gz\`)"
            echo "- Docker: \`docker pull ghcr.io/mythicalltd/peltycms:nightly\`"
            echo
            echo "Admin → Updates → channel **Nightly**, then check or run \`pelty-server update\`."
            echo
            echo "---"
            echo
            cat "$notes"
          } > "$RUNNER_TEMP/nightly-notes.md"
          gh release create "$float" "${files[@]}" \
            --title "PeltyCMS Nightly (${tag})" \
            --notes-file "$RUNNER_TEMP/nightly-notes.md" \
            --target "${{ github.sha }}" \
            --prerelease

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          float="${{ needs.meta.outputs.floating }}"
          tags="${IMAGE}:${tag}"
          if [ "${{ needs.meta.outputs.prerelease }}" = "false" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          if [ -n "$float" ]; then
            tags="${tags}"$'\n'"${IMAGE}:${float}"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Free disk for Docker
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker.outputs.tags }}
          cache-from: type=gha,scope=peltycms-docker
          cache-to: type=gha,mode=max,scope=peltycms-docker
