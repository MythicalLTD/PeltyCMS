<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<h1 id="title">Addon frame</h1>
<p id="who">…</p>
<button id="ping" type="button">Ping</button>
<pre id="out"></pre>
<script>
// Pelty iframe bridge: the parent sends `pelty:init` (theme, locale,
// context); requests go back as `pelty:request` and the parent answers
// with `pelty:response` (only this addon's routes or `bridge` prefixes).
(function () {
  var seq = 0, waiting = {};
  function req(path, method, body) {
    var id = ++seq;
    parent.postMessage({ type: "pelty:request", id: id, path: path, method: method || "GET", body: body }, "*");
    return new Promise(function (res, rej) { waiting[id] = { res: res, rej: rej }; });
  }
  function resize() { parent.postMessage({ type: "pelty:resize", height: document.documentElement.scrollHeight }, "*"); }
  window.addEventListener("message", function (e) {
    if (e.source !== parent) return;
    var m = e.data || {};
    if (m.type === "pelty:init") {
      for (var k in m.theme || {}) document.documentElement.style.setProperty(k, m.theme[k]);
      document.documentElement.lang = m.locale || "en";
      document.getElementById("who").textContent = (m.ctx && m.ctx.route) || "";
      resize();
    } else if (m.type === "pelty:response" && waiting[m.id]) {
      (m.ok ? waiting[m.id].res : waiting[m.id].rej)(m.body);
      delete waiting[m.id];
    }
  });
  document.getElementById("ping").addEventListener("click", function () {
    req("/api/v1/addons/integration-extdemo/ping?q=frame").then(function (b) {
      document.getElementById("out").textContent = JSON.stringify(b);
      resize();
    });
  });
  parent.postMessage({ type: "pelty:ready" }, "*");
})();
</script>
</body>
</html>
