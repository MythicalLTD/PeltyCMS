[package]
name = "pelty-addon-registrar-mock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["export"]
export = []

[dependencies]
pelty-addon-sdk = { workspace = true, features = ["provisioning"] }
pelty-provisioning = { path = "../../../crates/pelty-provisioning" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
