# cargo-deny: `cargo deny check licenses`
# Dependencies must stay compatible with PeltyCMS's GNU AGPL v3 (or later)
# and with the MIT-licensed addon SDK. Add a license here only after checking
# it is AGPL-compatible (no SSPL, BUSL, Commons Clause, CC-BY-NC, ...).

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Workspace crates are not published; their license is AGPL-3.0-or-later (or MIT for the SDK).
ignore = true

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
