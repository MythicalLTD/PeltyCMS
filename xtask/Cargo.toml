[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Cross-platform developer commands (`cargo xtask help`). Replaces the bash scripts behind the Makefile."

# Kept deliberately small: std::process for everything, ctrlc to stop child
# processes on Ctrl+C, serde_json for addon.json / the seed API, and ureq
# (no TLS by default) for `cargo xtask seed` against a local server; lzma-rs
# and tar (pure Rust) unpack the downloaded dev PostgreSQL on any OS.
[dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
lzma-rs = "0.3"
serde_json = { workspace = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
pelty-wasm = { path = "../crates/pelty-wasm", optional = true }
pelty-extensions = { path = "../crates/pelty-extensions", optional = true }
pelty-payments = { path = "../crates/pelty-payments", optional = true }
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false }
# `cargo xtask release`: archives, SHA256SUMS and their ed25519 signature.
flate2 = "1"
zip = { workspace = true }
ring = "0.17"
base64 = { workspace = true }

# kill(2) for process groups: the `kill` program differs between GNU and BSD
# (macOS) in how it takes negative PIDs.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[features]
# `cargo run -p xtask --features https -- seed` for an https:// PELTY_URL.
https = ["ureq/rustls"]
# Keep Wasmtime out of ordinary developer commands.
addon-test = ["dep:serde", "dep:pelty-wasm", "dep:pelty-extensions", "dep:pelty-payments", "dep:tracing", "dep:tracing-subscriber"]

[lints]
workspace = true
